<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>YKS Takip Panel QR Kodu</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    #qrcode {
      background: white;
      padding: 15px;
      border-radius: 12px;
      display: inline-block;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>YKS Takip Paneli</h2>
    <p>Tabletinle okutup doğrudan giriş yapabilirsin:</p>
    <div id="qrcode"></div>
  </div>

  <script>
    new QRCode(document.getElementById("qrcode"), {
      text: "https://keremyarar62-alt.github.io/yks-takip/",
      width: 220,
      height: 220
    });
  </script>
</body>
</html>
